<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>CoreBall — 绞盘总成</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 32px 24px 64px; background: #0d0f12; color: #d7dbe0;
         font: 15px/1.6 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif; }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 4px; }
  h2 { font-size: 15px; font-weight: 600; margin: 46px 0 6px; }
  h2 span { color: #6f7a85; font-weight: 400; font-size: 13px; margin-left: 8px; }
  .sub { color: #7c848d; font-size: 13px; }
  .grid { display: grid; gap: 18px; }
  .g3 { grid-template-columns: 1fr 1fr 1fr; }
  figure { margin: 0; }
  img { width: 100%; height: auto; display: block; border-radius: 10px;
        background: #14181c; box-shadow: 0 8px 32px rgba(0,0,0,.5); }
  figcaption { margin-top: 8px; font-size: 12.5px; color: #8b949e; }
  .wrap { max-width: 1180px; margin: 0 auto; }
  table { border-collapse: collapse; margin-top: 14px; font-size: 13.5px; }
  th, td { text-align: left; padding: 7px 20px 7px 0; border-bottom: 1px solid #1e242b; }
  th { color: #8b949e; font-weight: 500; white-space: nowrap; }
</style>
</head>
<body>
<div class="wrap">
  <h1>CoreBall — 绞盘总成</h1>
  <div class="sub">4 个一模一样 + 1 个完全不同</div>

  <h2>A 承力绞盘 <span>× 4，完全可互换</span></h2>
  <table>
    <tr><th>卷筒</th><td>φ34 × 26，轴竖直</td></tr>
    <tr><th>出线距离</th><td>横臂 200 mm（出线角 3.7°，保证单层绕线）</td></tr>
    <tr><th>张力测量</th><td>出线滑轮的销轴做负荷销，不用张力臂</td></tr>
    <tr><th>编码器</th><td>电机尾部磁编码器</td></tr>
  </table>
  <div class="grid g3" style="margin-top:18px">
    <figure><img src="winch_front.png" alt="承力绞盘 正面"><figcaption>正面</figcaption></figure>
    <figure><img src="winch_3q.png" alt="承力绞盘 3/4"><figcaption>四分之三</figcaption></figure>
    <figure><img src="winch_side.png" alt="承力绞盘 侧面"><figcaption>侧面</figcaption></figure>
  </div>

  <h2>B 供电张紧器 <span>× 1，弹簧被动件</span></h2>
  <table>
    <tr><th>收线</th><td>恒力弹簧盘，约 1 N</td></tr>
    <tr><th>走线</th><td>盘 → 吊点小滑轮 → 固定锚点，两股</td></tr>
    <tr><th>无</th><td>线圈、滑环、电机、编码器 —— 全都没有</td></tr>
    <tr><th>对吊点的力</th><td>+2 N 向上，恒定，可精确补偿</td></tr>
  </table>
  <div class="grid g3" style="margin-top:18px">
    <figure><img src="tension_front.png" alt="张紧器 正面"><figcaption>正面 · 两股线成 V</figcaption></figure>
    <figure><img src="tension_3q.png" alt="张紧器 3/4"><figcaption>四分之三</figcaption></figure>
    <figure><img src="tension_side.png" alt="张紧器 侧面"><figcaption>侧面</figcaption></figure>
  </div>
</div>
</body>
</html>
