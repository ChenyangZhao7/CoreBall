<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CoreBall · 控制台</title>
<style>
  :root { color-scheme: dark; --line:#1d2732; --panel:#10161d; --ink:#dfe7ef; --dim:#7d8a99; }
  html, body { height: 100%; }
  body { margin: 0; background: #0a0e12; color: var(--ink);
         font: 14px/1.5 "Segoe UI", "Microsoft YaHei", sans-serif;
         display: flex; flex-direction: column; overflow: hidden; }
  header { display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
           padding: 10px 16px; border-bottom: 1px solid var(--line); background: #0d131a; }
  h1 { font-size: 15px; font-weight: 600; letter-spacing: .06em; margin: 0 8px 0 0; }
  #dot { width: 9px; height: 9px; border-radius: 50%; background: #55606c; }
  #dot.on { background: #46c98b; box-shadow: 0 0 8px #46c98b; }
  #dot.off { background: #d9534f; }
  .spacer { flex: 1; }
  button, a.btn { background: #17202a; color: #cfdae6; border: 1px solid #263242;
                  border-radius: 8px; padding: 7px 12px; cursor: pointer; font: inherit;
                  text-decoration: none; }
  button:hover, a.btn:hover { background: #1d2937; }
  button.on { background: #2a6f8f; border-color: #3d92b8; color: #fff; }
  button:disabled { opacity: .4; cursor: default; }
  main { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 300px; }
  #stage { position: relative; min-width: 0; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  #hint { position: absolute; left: 14px; bottom: 12px; color: var(--dim);
          font-size: 12px; pointer-events: none; }
  aside { border-left: 1px solid var(--line); background: var(--panel);
          padding: 12px; overflow: auto; }
  .group { margin-bottom: 14px; }
  .group h3 { font-size: 11px; letter-spacing: .12em; color: #6f7f90;
              margin: 0 0 7px; font-weight: 600; text-transform: uppercase; }
  .dpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .dpad button { height: 38px; padding: 0; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; }
  .row button { flex: 1; min-width: 62px; }
  .row.two button { min-width: 0; }
  input[type=range] { width: 100%; accent-color: #4fa87f; }
  .val { color: #9fb0c2; font: 12px ui-monospace, Consolas, monospace; }
  #log { height: 110px; overflow: auto; background: #0b1016; border: 1px solid #1a242e;
         border-radius: 8px; padding: 7px 9px; font: 11.5px/1.55 ui-monospace, Consolas, monospace;
         color: #8b9aab; white-space: pre-wrap; }
  @media (max-width: 820px) {
    main { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
    aside { border-left: 0; border-top: 1px solid var(--line); max-height: 45vh; }
  }
</style>
</head>
<body>
<header>
  <h1>CoreBall · 控制台</h1>
  <span id="dot" title="控制服务状态"></span>
  <button id="mode">3D 视图</button>
  <span class="spacer"></span>
  <a class="btn" href="command.html">3D 指挥</a>
  <a class="btn" href="viewer.html">模型查看</a>
</header>

<main>
  <section id="stage">
    <canvas id="cv"></canvas>
    <div id="hint">点地面设定目标 · 按钮发指令 · 顶部可切 2D / 3D 等轴视图</div>
  </section>

  <aside>
    <div class="group">
      <h3>移动</h3>
      <div class="dpad">
        <span></span><button data-intent="up">↑ 升</button><span></span>
        <button data-intent="left">← 左</button><button data-intent="stop">停</button><button data-intent="right">右 →</button>
        <span></span><button data-intent="down">↓ 降</button><span></span>
      </div>
      <div class="row" style="margin-top:6px">
        <button data-intent="come">过来</button>
        <button data-intent="back">回去</button>
        <button data-intent="look">看我</button>
      </div>
    </div>

    <div class="group">
      <h3>高度</h3>
      <input id="z" type="range" min="900" max="1500" step="5" value="1300">
      <div class="val"><span id="zval">1300</span> mm</div>
    </div>

    <div class="group">
      <h3>身体</h3>
      <div class="row two">
        <button data-mount="winch" class="on">吊索</button>
        <button data-mount="rover">小车</button>
      </div>
    </div>

    <div class="group">
      <h3>表情</h3>
      <div class="row">
        <button data-expr="idle">待命</button>
        <button data-expr="listening">在听</button>
        <button data-expr="acting">执行</button>
      </div>
    </div>

    <div class="group">
      <h3>位置 <span class="val" id="pos"></span></h3>
      <h3>目标 <span class="val" id="tgt"></span></h3>
      <div id="log"></div>
    </div>
  </aside>
</main>

<script>
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");
const dot = document.getElementById("dot");
const logEl = document.getElementById("log");
const posEl = document.getElementById("pos");
const tgtEl = document.getElementById("tgt");
const zEl = document.getElementById("z");
const zVal = document.getElementById("zval");
const modeBtn = document.getElementById("mode");

const NEAR = [-380, 520, 1300];
const HOME = [-430, 760, 1420];
const ROVER_NEAR = [-450, 650, 0];
const ROVER_HOME = [600, 250, 0];

const state = {
  mode: "2d",
  body: "winch",
  pos: NEAR.slice(),
  target: NEAR.slice(),
  z: 1300,
  connected: null,
};

function log(msg) {
  const t = new Date().toLocaleTimeString();
  logEl.textContent = "[" + t + "] " + msg + "\n" + logEl.textContent;
  if (logEl.textContent.length > 4000) logEl.textContent = logEl.textContent.slice(0, 4000);
}

function setStatus(ok) {
  state.connected = ok;
  dot.className = ok ? "on" : "off";
  dot.title = ok ? "已发给控制服务" : "控制服务不可用";
}

async function send(msg, label) {
  try {
    const r = await fetch("/intent", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(msg),
    });
    if (!r.ok) throw new Error("HTTP " + r.status);
    setStatus(true);
    log((label || msg.intent) + (msg.point ? " " + msg.point.join(",") : ""));
  } catch (e) {
    setStatus(false);
    log("发送失败：" + e.message + "（先开 Blender 指挥场景）");
  }
  draw();
}

// ---------------- 视图 ----------------
function fit() {
  const r = cv.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.max(1, Math.round(r.width * dpr));
  cv.height = Math.max(1, Math.round(r.height * dpr));
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  draw();
}
window.addEventListener("resize", fit);

function view() {
  const W = cv.clientWidth, H = cv.clientHeight;
  if (state.mode === "2d") {
    const k = Math.min(W / 1900, H / 1300);
    return { k, cx: W / 2, cy: H / 2, iso: false };
  }
  const k = Math.min(W / 2100, H / 2600);
  return { k, cx: W / 2, cy: H * 0.86, iso: true };
}

function proj(x, y, z) {
  const v = view();
  if (!v.iso) {
    return [v.cx + (x - 0) * v.k, v.cy + (y - 550) * v.k];
  }
  return [v.cx + (x - 0.6 * y) * v.k, v.cy + (y * 0.35 - z) * v.k];
}

function unproject(sx, sy) {
  const v = view();
  if (!v.iso) {
    return [(sx - v.cx) / v.k, (sy - v.cy) / v.k + 550];
  }
  const y = (sy - v.cy) / (0.35 * v.k);
  const x = (sx - v.cx) / v.k + 0.6 * y;
  return [x, y];
}

function clampFloor(x, y) {
  // 三面墙内 + 实用区 y>=250，留球半径 40 + 5 mm 余量
  return [Math.max(-775, Math.min(775, x)), Math.max(250, Math.min(1055, y))];
}

function poly(pts, fill, stroke) {
  ctx.beginPath();
  pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]));
  ctx.closePath();
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 1; ctx.stroke(); }
}

function draw() {
  const W = cv.clientWidth, H = cv.clientHeight;
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = "#0a0e12";
  ctx.fillRect(0, 0, W, H);

  // 地面网格
  ctx.strokeStyle = "#121a22";
  ctx.lineWidth = 1;
  for (let x = -800; x <= 800; x += 200) {
    const a = proj(x, 0, 0), b = proj(x, 1100, 0);
    ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
  }
  for (let y = 0; y <= 1100; y += 100) {
    const a = proj(-820, y, 0), b = proj(820, y, 0);
    ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
  }

  // 地面轮廓
  poly([proj(-820, 0, 0), proj(820, 0, 0), proj(820, 1100, 0), proj(-820, 1100, 0)],
       "rgba(30,40,50,.35)", "#263543");

  // 三面围板：后墙 y=0、左墙 x=-820、右墙 x=+820；前面开口
  const WH = 1900;
  if (state.mode === "2d") {
    ctx.strokeStyle = "#3a4b5c";
    ctx.lineWidth = 4;
    [[[-820, 0], [-820, 1100]], [[820, 0], [820, 1100]], [[-820, 0], [820, 0]]]
      .forEach(([a, b]) => {
        const p0 = proj(a[0], a[1], 0), p1 = proj(b[0], b[1], 0);
        ctx.beginPath(); ctx.moveTo(p0[0], p0[1]); ctx.lineTo(p1[0], p1[1]); ctx.stroke();
      });
    ctx.setLineDash([7, 7]);
    ctx.strokeStyle = "#2a3743";
    const f0 = proj(-820, 1100, 0), f1 = proj(820, 1100, 0);
    ctx.beginPath(); ctx.moveTo(f0[0], f0[1]); ctx.lineTo(f1[0], f1[1]); ctx.stroke();
    ctx.setLineDash([]);
  } else {
    const fill = "rgba(45,62,78,.22)", edge = "#3a4b5c";
    // 后墙
    poly([proj(-820, 0, 0), proj(820, 0, 0), proj(820, 0, WH), proj(-820, 0, WH)],
         fill, edge);
    // 左墙
    poly([proj(-820, 0, 0), proj(-820, 1100, 0), proj(-820, 1100, WH), proj(-820, 0, WH)],
         fill, edge);
    // 右墙
    poly([proj(820, 0, 0), proj(820, 1100, 0), proj(820, 1100, WH), proj(820, 0, WH)],
         fill, edge);
    // 前开口：虚线
    ctx.setLineDash([7, 7]);
    ctx.strokeStyle = "#2a3743";
    const f0 = proj(-820, 1100, 0), f1 = proj(820, 1100, 0);
    ctx.beginPath(); ctx.moveTo(f0[0], f0[1]); ctx.lineTo(f1[0], f1[1]); ctx.stroke();
    ctx.setLineDash([]);
  }

  // 桌子 1560 × 700，中心 y=370，高 740
  const dx = 780, dy1 = 20, dy2 = 720, dz = 740;
  if (state.mode === "2d") {
    poly([proj(-dx, dy1, 0), proj(dx, dy1, 0), proj(dx, dy2, 0), proj(-dx, dy2, 0)],
         "rgba(120,100,80,.25)", "#4a4036");
  } else {
    poly([proj(-dx, dy1, dz), proj(dx, dy1, dz), proj(dx, dy2, dz), proj(-dx, dy2, dz)],
         "rgba(120,100,80,.35)", "#6a5a48");
    [[-dx, dy1], [dx, dy1], [dx, dy2], [-dx, dy2]].forEach(([x, y]) => {
      const a = proj(x, y, 0), b = proj(x, y, dz);
      ctx.strokeStyle = "#3a322a"; ctx.beginPath();
      ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
    });
  }

  // 禁区圆柱（脖子）
  const NX = 0, NY = 890, NR = 210;
  if (state.mode === "2d") {
    const c = proj(NX, NY, 0);
    ctx.beginPath();
    ctx.arc(c[0], c[1], NR * view().k, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(200,70,60,.12)";
    ctx.strokeStyle = "rgba(200,70,60,.65)";
    ctx.fill(); ctx.stroke();
  } else {
    const v = view(), c0 = proj(NX, NY, 0), c1 = proj(NX, NY, 1900);
    const rx = NR * v.k, ry = NR * 0.35 * v.k;
    [c0, c1].forEach(c => {
      ctx.beginPath(); ctx.ellipse(c[0], c[1], rx, ry, 0, 0, Math.PI * 2);
      ctx.strokeStyle = "rgba(200,70,60,.6)"; ctx.stroke();
    });
    for (let a = 0; a < Math.PI * 2; a += Math.PI / 4) {
      const x = NX + Math.cos(a) * NR, y = NY + Math.sin(a) * NR;
      const p0 = proj(x, y, 0), p1 = proj(x, y, 1900);
      ctx.strokeStyle = "rgba(200,70,60,.25)";
      ctx.beginPath(); ctx.moveTo(p0[0], p0[1]); ctx.lineTo(p1[0], p1[1]); ctx.stroke();
    }
  }

  // 锚点
  [[-760, 217], [760, 217], [-603, 850], [603, 850]].forEach(([x, y]) => {
    const p = proj(x, y, 1729);
    ctx.beginPath(); ctx.arc(p[0], p[1], 3, 0, Math.PI * 2);
    ctx.fillStyle = "#5f8fb0"; ctx.fill();
  });

  // 目标
  const t = proj(state.target[0], state.target[1], state.target[2]);
  ctx.strokeStyle = "#e0b060"; ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(t[0] - 7, t[1]); ctx.lineTo(t[0] + 7, t[1]);
  ctx.moveTo(t[0], t[1] - 7); ctx.lineTo(t[0], t[1] + 7);
  ctx.stroke();

  // 球
  const b = proj(state.pos[0], state.pos[1], state.mode === "2d" ? 0 : state.pos[2]);
  const r = Math.max(6, 40 * view().k);
  if (state.mode === "3d") {
    const f = proj(state.pos[0], state.pos[1], 0);
    ctx.strokeStyle = "rgba(140,200,240,.25)";
    ctx.beginPath(); ctx.moveTo(b[0], b[1]); ctx.lineTo(f[0], f[1]); ctx.stroke();
  }
  ctx.beginPath(); ctx.arc(b[0], b[1], r, 0, Math.PI * 2);
  ctx.fillStyle = "#cfe3f0"; ctx.fill();
  ctx.strokeStyle = "#4f9fcf"; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = "#cfe3f0"; ctx.font = "12px 'Microsoft YaHei'";
  ctx.fillText(state.body === "winch" ? "球" : "小车", b[0] + r + 5, b[1] + 4);

  posEl.textContent = state.pos.map(v => Math.round(v)).join(", ");
  tgtEl.textContent = state.target.map(v => Math.round(v)).join(", ");
}

// ---------------- 交互 ----------------
let down = null;
cv.addEventListener("pointerdown", e => {
  down = [e.clientX, e.clientY];
  cv.setPointerCapture(e.pointerId);
});
cv.addEventListener("pointerup", e => {
  if (!down) return;
  const moved = Math.hypot(e.clientX - down[0], e.clientY - down[1]);
  down = null;
  if (moved > 6) return;
  const r = cv.getBoundingClientRect();
  const p = unproject(e.clientX - r.left, e.clientY - r.top);
  const xy = clampFloor(p[0], p[1]);
  const z = state.body === "winch" ? state.z : 0;
  state.target = [xy[0], xy[1], z];
  state.pos = [xy[0], xy[1], z];
  send({ intent: "goto", point: state.target }, "去");
});

function moveTo(p) {
  state.pos = p.slice();
  state.target = p.slice();
  draw();
}

document.querySelectorAll("button[data-intent]").forEach(b => {
  b.addEventListener("click", () => {
    const name = b.dataset.intent;
    const rover = state.body === "rover";
    if (name === "up" || name === "down") {
      if (rover) { log("小车没有升降"); return; }
      const dz = name === "up" ? 120 : -120;
      state.z = Math.max(900, Math.min(1500, state.z + dz));
      state.pos[2] = state.z; state.target[2] = state.z;
      zEl.value = state.z; zVal.textContent = state.z;
    } else if (name === "left" || name === "right") {
      const dx = name === "left" ? 120 : -120;
      const nx = clampFloor(state.pos[0] + dx, state.pos[1])[0];
      state.pos[0] = nx; state.target[0] = nx;
    } else if (name === "come") {
      moveTo(rover ? ROVER_NEAR : NEAR);
      if (!rover) state.z = 1300;
    } else if (name === "back") {
      moveTo(rover ? ROVER_HOME : HOME);
      if (!rover) state.z = 1420;
    }
    send({ intent: name });
  });
});

document.querySelectorAll("button[data-mount]").forEach(b => {
  b.addEventListener("click", () => {
    const body = b.dataset.mount;
    if (state.body === body) return;
    state.body = body;
    document.querySelectorAll("button[data-mount]").forEach(x =>
      x.classList.toggle("on", x.dataset.mount === body));
    if (body === "rover") {
      state.z = 0;
      moveTo(ROVER_HOME);
    } else {
      state.z = 1300;
      moveTo(NEAR);
    }
    zEl.value = state.z; zVal.textContent = state.z;
    send({ intent: "mount_" + body }, "换到" + (body === "rover" ? "小车" : "吊索"));
  });
});

document.querySelectorAll("button[data-expr]").forEach(b => {
  b.addEventListener("click", () => {
    document.querySelectorAll("button[data-expr]").forEach(x => x.classList.remove("on"));
    b.classList.add("on");
    send({ intent: "expression", name: b.dataset.expr }, "表情 " + b.dataset.expr);
  });
});

zEl.addEventListener("input", () => {
  state.z = Number(zEl.value);
  zVal.textContent = state.z;
  if (state.body === "winch") {
    state.pos[2] = state.z; state.target[2] = state.z;
  }
  draw();
});
zEl.addEventListener("change", () => {
  if (state.body !== "winch") return;
  state.target = [state.target[0], state.target[1], state.z];
  send({ intent: "goto", point: state.target }, "高度 " + state.z);
});

modeBtn.addEventListener("click", () => {
  state.mode = state.mode === "2d" ? "3d" : "2d";
  modeBtn.textContent = state.mode === "2d" ? "3D 视图" : "2D 视图";
  draw();
});

log("控制台就绪。先打开 Blender 的「指挥」场景（UDP 4590）。");
fit();
</script>
</body>
</html>
